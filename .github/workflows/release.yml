name: Release

# Builds the standalone `darkcode` CLI binaries and attaches them to a GitHub
# Release. Triggered by pushing a `v*` tag (e.g. `git tag v1.0.0 && git push
# --tags`), or manually via the Actions tab.
#
# Binaries are built on a native runner per platform — NOT cross-compiled —
# because `bun build --compile` embeds OpenTUI's prebuilt native render library
# (`@opentui/core-<os>-<arch>`), and only the host's matching native package is
# installed by `bun install`. Each runner therefore produces exactly one
# target. The install scripts (darkcode.sh/install.sh, /install.ps1) download
# these assets from the `latest` release.
#
# Release flow is two stages ON PURPOSE: a single `create-release` job creates
# the GitHub Release ONCE, then the per-platform `build` matrix uploads each
# asset into that existing release. This avoids the matrix race where N jobs
# each try to *create* the release concurrently and split the assets across
# duplicate release objects. And because each platform uploads independently, a
# slow or stuck runner (e.g. a backlogged Intel-mac) delays only its own asset,
# never the whole release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.0.0)"
        required: true

# Needed to create/update the Release and upload assets.
permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Create the release once. Idempotent: reuse it if it already exists (e.g.
      # on a workflow re-run), so this never fails a retry. The build matrix
      # below uploads assets into this release.
      - name: Create or reuse the GitHub release
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi

  build:
    name: ${{ matrix.asset }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    # `bun install` runs @darkcode/server's postinstall -> `prisma generate`,
    # which loads prisma.config.ts and resolves DATABASE_URL via prisma's strict
    # env(). generate never connects and the CLI binary contains no database
    # code, so a throwaway value is enough. Mirrors the Dockerfile deps stage.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple silicon
            asset: darkcode-darwin-arm64
            archive: tar
          - runner: macos-13 # Intel
            asset: darkcode-darwin-x64
            archive: tar
          - runner: ubuntu-latest
            asset: darkcode-linux-x64
            archive: tar
          - runner: ubuntu-24.04-arm # GitHub-hosted arm64; remove if unavailable on your plan
            asset: darkcode-linux-arm64
            archive: tar
          - runner: windows-latest
            asset: darkcode-windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build standalone binary
        shell: bash
        run: |
          out="darkcode"
          [ "${{ matrix.archive }}" = "zip" ] && out="darkcode.exe"
          bun build packages/cli/src/index.tsx \
            --compile \
            --define "process.env.DARKCODE_VERSION=\"${{ steps.version.outputs.version }}\"" \
            --outfile "$out"

      - name: Package (tar.gz + checksum)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          chmod +x darkcode
          tar -czf "${{ matrix.asset }}.tar.gz" darkcode
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi

      - name: Package (zip + checksum)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path darkcode.exe -DestinationPath "${{ matrix.asset }}.zip" -Force
          $hash = (Get-FileHash "${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ascii "${{ matrix.asset }}.zip.sha256"

      # Upload this platform's asset(s) into the release created above. --clobber
      # replaces an asset of the same name, so re-runs are idempotent. Uploads
      # can't race because the release already exists — none of these jobs ever
      # create it.
      - name: Upload assets to the release
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            files=("${{ matrix.asset }}.zip" "${{ matrix.asset }}.zip.sha256")
          else
            files=("${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}.tar.gz.sha256")
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
